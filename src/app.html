<!doctype html>
<html lang="id" class="scroll-smooth">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- Favicon di URL tetap; Google tidak membaca favicon berbentuk data URI. -->
	<link rel="icon" href="/favicon.ico" sizes="48x48" />
	<link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
	<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
	<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	<meta name="google-site-verification" content="Hg128Is3hPDTKa_t81Ikr1QqP7vl9d4yNBgyV0L1C-s" />
	<link rel="preload" href="/fonts/outfit-variable.woff2" as="font" type="font/woff2" crossorigin />

	<!-- Google Analytics 4. send_page_view dimatikan karena SvelteKit berpindah
	     halaman tanpa reload; page_view dikirim manual di +layout.svelte. -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-1HWL6411HR"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());
		gtag('config', 'G-1HWL6411HR', { send_page_view: false });
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover"
	class="font-outfit text-slate-800 bg-slate-50 antialiased selection:bg-blue-500 selection:text-white">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
